name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: statusline-x86_64-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            asset: statusline-aarch64-linux-musl
            musl: true
          - os: macos-latest
            asset: statusline-aarch64-macos
          - os: macos-13
            asset: statusline-x86_64-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make test
      - run: make clean && make
      - run: cp statusline "${{ matrix.asset }}"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
