name: Dependabot auto-merge

# Mergt Dependabot-PRs, sobald die CI auf dem PR grün ist (auch Major-Updates).
# Ohne GitHub Pro gibt es für private Repos keine Pflicht-Checks, deshalb wartet
# dieser Workflow selbst auf den erfolgreichen CI-Lauf. Kein Deploy auf main,
# Releases laufen über Tags.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Mergen
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --state open --json number,author \
            --jq '.[] | select(.author.login == "app/dependabot") | .number')
          if [ -z "$pr" ]; then
            echo "Kein offener Dependabot-PR für $BRANCH"
            exit 0
          fi
          gh pr merge "$pr" --squash --match-head-commit "$SHA"
