name: Release

# Bundles everything merged since the last release: tags main with the next
# minor or major version and publishes a GitHub release listing the merged
# pull requests and closed tickets, then builds the portable binaries from the
# new tag and attaches them. Patch versions are tagged automatically by CI on
# every merge and get no release of their own.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [minor, major]
        default: minor

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        run: python3 .github/scripts/release.py release "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Workflows to start on main afterwards, e.g. a deploy that stamps the
          # version into the app. Empty: none.
          DISPATCH: ""

  binaries:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: statusline-x86_64-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            asset: statusline-aarch64-linux-musl
            musl: true
          - os: macos-latest
            asset: statusline-aarch64-macos
          - os: macos-15-intel
            asset: statusline-x86_64-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make test
      - run: make clean && make
      - run: cp statusline "${{ matrix.asset }}"
      - run: gh release upload "$VERSION" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
