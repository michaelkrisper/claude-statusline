name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: statusline-x86_64-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            asset: statusline-aarch64-linux-musl
            musl: true
          - os: macos-latest
            asset: statusline-aarch64-macos
          - os: macos-15-intel
            asset: statusline-x86_64-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make test
      - run: make clean && make
      - run: cp statusline "${{ matrix.asset }}"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
