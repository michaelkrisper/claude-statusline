name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make test
      # the release binary is built static against musl; -Werror keeps the build honest
      - run: make clean && make CFLAGS='-std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections'
      - run: ./statusline --help
      - name: smoke test
        run: echo '{"cwd":"/tmp","context_window":{"used_percentage":12.5}}' | ./statusline
